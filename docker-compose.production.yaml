services:
  rails:
    image: jaimespenst/custom-free-chatwoot:latest
    env_file: ".env.production"
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      - "3000:3000"
    command: ["sh", "-c", "bundle exec rails db:prepare && bundle exec rails s -b 0.0.0.0 -p 3000"]

  sidekiq:
    image: jaimespenst/custom-free-chatwoot:latest
    env_file: ".env.production"
    restart: always
    depends_on:
      - postgres
      - redis
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    env_file: ".env.production"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: always
    env_file: ".env.production"
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  redis_data:
